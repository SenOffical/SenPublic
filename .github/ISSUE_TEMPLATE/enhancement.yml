name: "✨ 功能请求"
description: "提出一个新功能或改进建议。"
title: "[Feature]: "
labels: ["enhancement"]
projects: ["SenOffical/SenPublic"]
assignees:
  - octocat
type: feature
body:
  - type: markdown
    attributes:
      value: |
        🙏 感谢您花时间提出功能建议！

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ 例行检查
      description: 请在提交前逐项确认以下内容
      options:
        - label: 我已确认目前没有类似的功能请求
          required: true
        - label: 我已确认我已升级到最新版本（如适用）
          required: true
        - label: 我已完整查看过项目 README，了解现有功能范围
          required: true
        - label: 我理解并愿意跟进此建议，协助提供反馈或测试
          required: true
        - label: 我理解并认可上述内容，并理解项目维护者精力有限，**不遵循规则的 issue 可能会被无视或直接关闭**
          required: true

  - type: input
    id: version
    attributes:
      label: 📦 相关版本（如适用）
      description: 如果该功能与特定版本有关，请填写
      placeholder: 例如 26.08.03
    validations:
      required: false

  - type: textarea
    id: feature-description
    attributes:
      label: 📝 功能描述
      description: 请清晰、简洁地描述您希望添加的功能
      placeholder: 描述这个功能是什么，以及它能解决什么问题
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🎯 使用场景
      description: 请说明在什么情况下会使用这个功能，以及它能为用户带来什么价值
      placeholder: |
        例如：当我在处理大量数据时，希望可以一键导出报表，这样可以节省手动整理的时间。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 替代方案
      description: 您是否考虑过其他实现方式？或者当前是否有变通的解决方法？
      placeholder: 描述您尝试过的其他方案，或现有的 workaround
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 📎 附加信息
      description: 如有相关截图、参考实现、设计稿或外部链接，请在此提供
      placeholder: 可以粘贴图片、URL 或其他补充材料
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ 验收标准（可选）
      description: 如果可能，请列出您认为该功能应满足的具体条件
      placeholder: |
        - [ ] 能够支持批量导入
        - [ ] 导入过程有进度提示
        - [ ] 错误时给出明确提示
    validations:
      required: false